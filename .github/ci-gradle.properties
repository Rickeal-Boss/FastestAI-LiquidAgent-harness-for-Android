# =============================================================================
# CI-only Gradle properties
#
# 加载方式：build.yml / release.yml 里执行
#   cat .github/ci-gradle.properties > "$HOME/.gradle/gradle.properties"
#
# 优先级（高 → 低）：
#   命令行 -D / -P  >  用户级 ~/.gradle/gradle.properties  >  项目级 gradle.properties
# 即本文件会覆盖项目根 gradle.properties 的同名键。
# 因此这里【只放与「构建环境」相关的开关】，绝不涉及依赖版本 / SDK 版本等工程决策
# —— 那些归 app 模块的 build.gradle.kts 与 gradle/libs.versions.toml，放这里会打架。
# =============================================================================

# -----------------------------------------------------------------------------
# 内存与守护进程
# -----------------------------------------------------------------------------
# GitHub-hosted runner (ubuntu-latest) 约 4 vCPU / 16 GB RAM。
# 4g heap + 1g metaspace 够 AGP + Compose 编译器用，同时给 Kotlin 编译进程留余量。
# 与 workflow 里的 GRADLE_JVM_ARGS 保持一致（命令行 -D 优先级更高，属双保险）。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# CI 是一次性任务，不留常驻守护进程，避免进程残留导致的锁竞争
# （本地 Windows 侧的孤儿 daemon 持锁是另一个已知问题，见 scripts/fulltest.sh 注释）。
org.gradle.daemon=false

# 多模块并行执行；单模块时无副作用。代价是日志交错、可读性下降 ——
# 本项目模块数不多且 CI 耗时敏感，选择开启。
org.gradle.parallel=true

# -----------------------------------------------------------------------------
# 缓存
# -----------------------------------------------------------------------------
# 配置缓存显式关闭：AGP + Compose 编译器插件的组合仍有「配置期读外部输入」导致
# cache miss / 行为不确定的报告。CI 的正确性优先于几十秒的速度；
# 构建稳定后可尝试 org.gradle.configuration-cache=true 并观察命中率。
org.gradle.configuration-cache=false

# task 级构建缓存开启：由 gradle/actions/setup-gradle 负责缓存
# ~/.gradle/caches/build-cache-1。
org.gradle.caching=true

# -----------------------------------------------------------------------------
# Kotlin
# -----------------------------------------------------------------------------
# CI 每次都是全新 checkout，增量编译没有意义，关掉可省 Kotlin 守护进程与增量快照
# 开销，同时规避 kotlin.incremental 在 CI 上的偶发状态不一致。
kotlin.incremental=false

# -----------------------------------------------------------------------------
# Android 构建行为
# -----------------------------------------------------------------------------
# 允许 AGP 自动下载缺失的 platform / build-tools。CI 上必须开启
# （runner 镜像自带的 SDK 版本不一定等于本仓 compileSdk）。
# ⚠️ 前提：workflow 已预先写好 SDK 许可哈希（Bootstrap Android SDK 步骤），
#    否则下载会以「license not accepted」失败。
android.builder.sdkDownload=true

# AGP 8+ 默认行为，显式声明以保证本地与 CI 一致。
# 后果：R 类不跨模块传递，各模块只引用自己的 R。
android.nonTransitiveRClass=true

# AGP 8+ 默认 true：R 类字段非 final，增量编译效果更好。
android.nonFinalResIds=true

# 只用 androidx（本仓无 legacy support 依赖需求）。
android.useAndroidX=true

# -----------------------------------------------------------------------------
# 编码
# -----------------------------------------------------------------------------
# 不用 systemProp.file.encoding 设置编码，原因：
#   1) JVM 启动后再设置 file.encoding 对已初始化的默认字符集无效；
#   2) JDK 18+ 默认已是 UTF-8，Gradle 跑在 JDK 21 上无需干预；
#   3) 上面的 org.gradle.jvmargs 已带 -Dfile.encoding=UTF-8，覆盖编译进程场景。
# 若真遇到跨平台编码问题，在 .editorconfig / Kotlin 编译器参数层面解决。
