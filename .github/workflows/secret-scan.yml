name: Secret scan

# =============================================================================
# 独立密钥扫描流水线（隐私扫描报告 Risk 4）。
#
# 为什么独立：`build.yml` 的 `on.push` / `on.pull_request` 用 `paths-ignore` 排除了
# `docs/**` 与 `**/*.md`，导致**纯文档提交 0 run**、密钥扫描根本不执行——而本仓的
# 个人信息、本机路径、响应原文恰恰都写在文档里。本流水线**不**忽略任何路径，
# 确保任何提交（含纯文档改动）都经过 gitleaks + trufflehog 全历史扫描。
#
# 零密钥：仅用 `github.token`（上下文），不引用 `secrets.*`（与 build.yml 约束一致）。
#
# 严禁给扫描步骤加 `continue-on-error` / `|| true`：扫描「红但被吞」比不扫更坏。
# =============================================================================

on:
  push:
    # 新增长期开发分支时回来补这一行（同 build.yml 约束 2）。
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 必须全历史：只扫本次 diff 会漏掉「曾经提交过、后来删掉但仍在历史里」的密钥。
          fetch-depth: 0

      - name: gitleaks（正则 + 熵；快、误报多）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install trufflehog
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          "$HOME/.local/bin/trufflehog" --version

      - name: trufflehog（live verification；慢、只报真需要轮换的）
        # `git file://$PWD` = 扫全历史；`--only-verified` = 只报验证通过的；
        # `--fail` = 有命中即以 183 退出（本步骤判红的唯一依据，不靠解析文本）。
        run: |
          set -uo pipefail
          "$HOME/.local/bin/trufflehog" git "file://$PWD" \
            --only-verified \
            --no-update \
            --fail

      # ======================================================================
      # 判据 3b-ext（W42 入闸）：本机路径 / 设备标识 / PAT 长度元信息三类脱敏。
      # 为什么进本 workflow：W41 以「证据入仓」名义把 22 行本机绝对路径写进
      # evidence/raw/w41/*.txt，四闸门全绿但红线失守——gitleaks/trufflehog 只认
      # 密钥形状，不认路径。本 workflow 不 ignore 任何路径（含纯文档与 evidence），
      # 是唯一能覆盖该盲区的门禁。敏感串两段拼装，避免判据自身制造正常态命中。
      # 严禁加 continue-on-error / `|| true`：命中即 exit 1。
      # ======================================================================
      - name: 3b-ext（路径 / 设备标识 / PAT 元信息脱敏；覆盖 evidence/raw/**）
        run: |
          set -uo pipefail
          S1="1330""9cc8"      # 设备标识（两段拼装避免本文件自命中）
          P1="D:/WB""fil"      # 本机绝对路径形态 1（盘符）
          P2="/d/WB""fil"      # 本机绝对路径形态 2（Git Bash 挂载）
          M1="长度 ""129"      # PAT 长度元信息
          if grep -rniE "$S1|$P1|$P2|$M1" docs evidence 2>/dev/null; then
            echo "RED sensitive leak hit"
            exit 1
          fi
          echo "OK no device-id/path/pat-meta"
