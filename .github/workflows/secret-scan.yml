name: Secret scan

# =============================================================================
# 独立密钥扫描流水线（隐私扫描报告 Risk 4）。
#
# 为什么独立：`build.yml` 的 `on.push` / `on.pull_request` 用 `paths-ignore` 排除了
# `docs/**` 与 `**/*.md`，导致**纯文档提交 0 run**、密钥扫描根本不执行——而本仓的
# 个人信息、本机路径、响应原文恰恰都写在文档里。本流水线**不**忽略任何路径，
# 确保任何提交（含纯文档改动）都经过 gitleaks + trufflehog 全历史扫描。
#
# 零密钥：仅用 `github.token`（上下文），不引用 `secrets.*`（与 build.yml 约束一致）。
#
# 严禁给扫描步骤加 `continue-on-error` / `|| true`：扫描「红但被吞」比不扫更坏。
# =============================================================================

on:
  push:
    # 新增长期开发分支时回来补这一行（同 build.yml 约束 2）。
    branches: [main]
  pull_request:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # 必须全历史：只扫本次 diff 会漏掉「曾经提交过、后来删掉但仍在历史里」的密钥。
          fetch-depth: 0

      - name: gitleaks（正则 + 熵；快、误报多）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install trufflehog
        run: |
          set -uo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh \
            | sh -s -- -b "$HOME/.local/bin"
          "$HOME/.local/bin/trufflehog" --version

      - name: trufflehog（live verification；慢、只报真需要轮换的）
        # `git file://$PWD` = 扫全历史；`--only-verified` = 只报验证通过的；
        # `--fail` = 有命中即以 183 退出（本步骤判红的唯一依据，不靠解析文本）。
        run: |
          set -uo pipefail
          "$HOME/.local/bin/trufflehog" git "file://$PWD" \
            --only-verified \
            --no-update \
            --fail

      # ======================================================================
      # 判据 3b-ext（W42 入闸）：本机路径 / 设备标识 / PAT 长度元信息三类脱敏。
      # 为什么进本 workflow：W41 以「证据入仓」名义把 22 行本机绝对路径写进
      # evidence/raw/w41/*.txt，四闸门全绿但红线失守——gitleaks/trufflehog 只认
      # 密钥形状，不认路径。本 workflow 不 ignore 任何路径（含纯文档与 evidence），
      # 是唯一能覆盖该盲区的门禁。敏感串两段拼装，避免判据自身制造正常态命中。
      # 严禁加 continue-on-error / `|| true`：命中即 exit 1。
      # ======================================================================
      # W43 加固（报告 P1-2）：W42 入闸版只扫 docs evidence 两目录且正则漏 C 盘用户目录
      #   形态 ⇒ g3_selftest.txt:3 的真实本机路径空过、CI 假绿。改为 git grep 全树 tracked
      #   文件（含 .github / 根目录 / core-*/src，无豁免），补三类用户目录形态；显式判 rc，
      #   grep 故障(rc≥2) 不得被 if 吞成 OK。全部分段拼装避免本文件自命中。
      - name: 3b-ext（路径 / 设备标识 / PAT 元信息脱敏；全树无豁免）
        run: |
          set -uo pipefail
          S1="1330""9cc8"      # 设备标识（分段拼装避免本文件自命中）
          P1="D:/WB""fil"      # 本机绝对路径形态 1（盘符）
          P2="/d/WB""fil"      # 本机绝对路径形态 2（Git Bash 挂载）
          BS='\'
          U1="C:${BS}Users"    # 用户目录形态 1（Windows 反斜杠）
          U2="C:/Us""ers"      # 用户目录形态 2（Windows 正斜杠）
          U3="/Us""ers/"       # 用户目录形态 3（POSIX macOS）
          U4="/ho""me/"        # 用户目录形态 4（POSIX Linux）
          M1="长度 ""129"      # PAT 长度元信息
          # git grep 只扫 tracked 文件（全树、无豁免）；-F 字面匹配避免反斜杠正则转义；
          # -I 跳过二进制。rc：0=命中(红) 1=无命中(绿) ≥2=故障(红，不吞)。
          set +e
          git grep -nIF -e "$S1" -e "$P1" -e "$P2" -e "$U1" -e "$U2" -e "$U3" -e "$U4" -e "$M1" -- .
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "RED sensitive leak hit"
            exit 1
          fi
          if [ "$rc" -ge 2 ]; then
            echo "RED 3b-ext scan fault (grep rc=$rc)"
            exit 1
          fi
          # W44（W36-01 出口判据收口）：git grep 只扫 tracked 文件，本地「git add -f
          #   纳入未 tracked 新文件」的注入场景对它空过（W43 交接边界④自认）。补一段
          #   未 tracked 工作树文件扫描：`git ls-files --others --exclude-standard` 逐文件
          #   grep 同一组八类形态；任何命中 ⇒ RED。正常态 CI checkout 后无未 tracked
          #   文件（绿）；本地复刻「新建含 serial 的未 tracked 文件」⇒ RED（实测留痕
          #   evidence/raw/w44/g0_untracked_scan.txt）。while-read 循环而非 xargs：
          #   MSYS xargs 有非致命断言噪声，CI 是 Linux 不受影响，但两侧行为保持一致。
          untracked_hits=0
          while IFS= read -r f; do
            if grep -qIF -e "$S1" -e "$P1" -e "$P2" -e "$U1" -e "$U2" -e "$U3" -e "$U4" -e "$M1" -- "$f" 2>/dev/null; then
              echo "RED untracked leak hit: $f"
              untracked_hits=$((untracked_hits+1))
            fi
          done < <(git ls-files --others --exclude-standard)
          if [ "$untracked_hits" -gt 0 ]; then
            echo "RED untracked sensitive leak ($untracked_hits files)"
            exit 1
          fi
          # W45（W36-01 精确场景收口，外审 P0-2）：
          #   - 上面第二路 --ignored 覆盖「被 ignore 但**未** -f」的本地未提交文件
          #     （W44 g0 自证 12 个含本地路径的取证文件曾被判 GREEN 的那层空过）；
          #   - 「被 ignore **且** git add -f」的文件进了 index、不再是 --others，
          #     由本步**开头的 tracked `git grep`（第 90 行）**拦截 —— 两路合起来才完整覆盖
          #     W36-01 的出口判据，缺一路都空过（g0_untracked_scan_v2.txt 三态实证）。
          ignored_hits=0
          while IFS= read -r f; do
            case "$f" in
              .gradle/*|.kotlin/*|build/*|*/build/*) continue ;;
            esac
            case "$f" in
              *.bin|*.lock|*.apk|*.dex|*.class|*.so|*.png|*.jpg|*.jpeg) continue ;;
            esac
            if grep -qIF -e "$S1" -e "$P1" -e "$P2" -e "$U1" -e "$U2" -e "$U3" -e "$U4" -e "$M1" -- "$f" 2>/dev/null; then
              echo "RED ignored-file leak hit: $f"
              ignored_hits=$((ignored_hits+1))
            fi
          done < <(git ls-files --others --ignored --exclude-standard)
          if [ "$ignored_hits" -gt 0 ]; then
            echo "RED ignored sensitive leak ($ignored_hits files)"
            exit 1
          fi
          echo "OK no device-id/path/pat-meta"
