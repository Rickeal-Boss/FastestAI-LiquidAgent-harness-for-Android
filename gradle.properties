# =============================================================================
# FastestAI-Harness (LiquidAgent) — 项目级 Gradle 属性
#
# 注意：CI 会把 .github/ci-gradle.properties 覆盖到 ~/.gradle/gradle.properties，
#      用户级优先级更高，所以这里【只写工程决策】，不要写与构建环境重复的开关，
#      避免两边打架。
# =============================================================================

# -----------------------------------------------------------------------------
# 内存 / 守护进程
# -----------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# 多模块工程：开并行
org.gradle.parallel=true

# 开荒阶段关闭配置缓存（AGP + Compose 编译器组合的配置期外部输入尚不稳定）
org.gradle.configuration-cache=false

# -----------------------------------------------------------------------------
# Kotlin
# -----------------------------------------------------------------------------
kotlin.code.style=official
# Android 目标 JVM 与 Gradle 目标 JVM 不一致时的告警很吵，显式声明
kotlin.jvm.target.validation.mode=warning

# -----------------------------------------------------------------------------
# Android
# -----------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# 允许 AGP 自动下载缺失的 platform / build-tools
android.builder.sdkDownload=true
