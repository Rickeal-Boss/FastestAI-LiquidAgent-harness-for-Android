# =============================================================================
# FastestAI-Harness (LiquidAgent) — Gradle Version Catalog
#
# 铁律：版本矩阵锁死，任何人不得升降级（照抄旧仓 Android-Agent 已验证矩阵）。
#   注意：AGP 9 内置 Kotlin，Kotlin 版本由 AGP 决定，改本文件的 kotlin = "..." 无效
#   （低版本会被 Gradle 自动升级）。
#
# 禁止出现的依赖：KSP / Room / Hilt / Dagger / Koin / Navigation3 /
#                  Retrofit / Coil / 任何注解处理器 / 任何 JitPack 库。
# 允许的例外：OkHttp 4.12.0（远程引擎的 HTTP 客户端，手写 SSE，不用 Retrofit）。
# =============================================================================

[versions]

agp = "9.3.2"
kotlin = "2.3.0"

# Android SDK（AGP 9 块式 DSL：compileSdk { version = release(36) }）
compileSdk = "36"
targetSdk = "36"
minSdk = "31"
javaJvmTarget = "17"

# Compose
composeBom = "2026.02.00"
materialIcons = "1.7.8"
activityCompose = "1.10.1"
navigationCompose = "2.8.9"
lifecycle = "2.8.7"

# KotlinX
kotlinxCoroutines = "1.9.0"
kotlinxSerialization = "1.7.3"

# AndroidX
coreKtx = "1.15.0"
datastore = "1.1.7"

# 网络（唯一允许的第三方 HTTP 栈：远程引擎 / MCP 传输）
okhttp = "4.12.0"

# 测试（JVM 单测；AGP 不自动提供 junit，需显式声明）
junit = "4.13.2"

[libraries]

# ---- AndroidX 基础 ----
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }

# ---- Lifecycle ----
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# ---- Navigation（2.x，不是 Navigation 3） ----
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# ---- DataStore（禁 Room，持久化走 Preferences + JSON 文件） ----
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ---- Compose（BOM 统一管版本） ----
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# 矩阵锁定 1.7.8，显式覆盖 BOM
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }

# ---- KotlinX ----
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# ---- 网络（手写 SSE，禁 Retrofit） ----
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }

# ---- 测试（JVM 单测） ----
# AGP 的 unit test task（testDebugUnitTest）默认走 JUnit4，但 AGP **不会**自动提供
# junit 依赖 —— 在非空测试源集上不显式声明就会找不到测试框架。
# ⚠️ 必须用 **kotlin-test-junit** 而不是裸 kotlin-test（旧仓 CI 实测）：
#   `kotlin.test.Test` 是指向 `org.junit.Test` 的 `actual typealias`，**只存在于框架专属
#   构件**里；裸 `org.jetbrains.kotlin:kotlin-test` 只提供 assertEquals / assertTrue 等
#   断言函数，会报 15 条 `Unresolved reference 'Test'`。
# catalog 键名仍保留 `kotlin-test`（访问器 `libs.kotlin.test` 不变）。
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# Kotlin 2.x：Compose 编译器由 KGP 内置，版本号跟随 kotlin
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
